services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: changetools-postgres
    environment:
      POSTGRES_USER: changetools
      POSTGRES_PASSWORD: changetools
      POSTGRES_DB: changetools
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U changetools"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
