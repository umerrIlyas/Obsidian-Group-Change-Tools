# Render blueprint for one-click deploy.
# Connect this repo in Render → New → Blueprint → it picks this file up.
#
# Required env vars (set in Render dashboard, NOT committed):
#   GROQ_API_KEY               (or OPENAI_API_KEY / ANTHROPIC_API_KEY)
#   DATABASE_URL               (Neon — must have pgvector extension enabled)
#   R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY,
#   R2_BUCKET, R2_ENDPOINT     (Cloudflare R2; or omit for filesystem storage)
#   LANGCHAIN_API_KEY          (optional, for tracing)
#
# After first deploy: open Render shell and run `alembic upgrade head` once.

services:
  - type: web
    name: changetools-api
    runtime: docker
    repo: https://github.com/<your-org>/changetools  # update before deploy
    rootDir: apps/api
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter   # change to free if appropriate; LibreOffice + sentence-transformers want some RAM
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: CORS_ALLOWED_ORIGINS
        sync: false   # set to your Vercel URL, e.g. https://changetools.vercel.app
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: EMBEDDING_PROVIDER
        value: local
      - key: EMBEDDING_MODEL_LOCAL
        value: BAAI/bge-small-en-v1.5
      - key: EMBEDDING_DIM
        value: "384"
      - key: DATABASE_URL
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_PUBLIC_BASE_URL
        sync: false
      - key: LANGCHAIN_TRACING_V2
        value: "true"
      - key: LANGCHAIN_API_KEY
        sync: false
      - key: LANGCHAIN_PROJECT
        value: changetools-prod
      - key: LANGCHAIN_ENDPOINT
        value: https://api.smith.langchain.com
