[project]
name = "changetools"
version = "0.1.0"
description = "Agentic AI workflow that turns change-programme materials into a structured brief and slide deck."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Rauf Khan" }]
license = { text = "MIT" }

dependencies = [
    # Web framework
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",

    # Config + validation
    "pydantic>=2.7",
    "pydantic-settings>=2.4",

    # Logging
    "structlog>=24.1",

    # LangChain / LangGraph ecosystem
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-community>=0.3",
    "langchain-groq>=0.2",
    "langchain-openai>=0.2",
    "langchain-anthropic>=0.2",
    "langgraph>=0.2",
    "langsmith>=0.1.130",

    # Embeddings
    "sentence-transformers>=3.0",

    # Database
    "sqlalchemy[asyncio]>=2.0",
    "greenlet>=3.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",

    # Document parsing
    "python-docx>=1.1",
    "openpyxl>=3.1",

    # Slide rendering
    "python-pptx>=1.0",
    "Pillow>=10.4",

    # Storage
    "boto3>=1.35",

    # Misc
    "tenacity>=9.0",
    "numpy>=1.26",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "anyio>=4.4",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-boto3>=1.35",
    "respx>=0.21",
    "freezegun>=1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/changetools"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort
    "B",             # bugbear
    "UP",            # pyupgrade
    "N",             # pep8-naming
    "SIM",           # simplify
    "RUF",           # ruff-specific
    "T20",           # no print
    "PT",            # pytest style
]
ignore = [
    "E501",   # line length — ruff format handles it
    "B008",   # FastAPI ``Depends(...)`` in defaults is idiomatic
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]   # asserts allowed in tests
"src/changetools/eval/__main__.py" = ["T201"]   # CLI prints intended

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
# MVP-level config: catch real bugs (None misuse, broken signatures, unreachable
# code in core paths) without demanding fully-annotated boilerplate that hurts
# velocity on infrastructure glue. We can tighten this back toward `strict`
# incrementally as the codebase stabilizes.
python_version = "3.11"
plugins = ["pydantic.mypy"]
files = ["src"]
exclude = ["tests/", "alembic/"]
strict_optional = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
# Intentionally off: `disallow_untyped_defs`, `disallow_any_generics`,
# `warn_return_any`, `warn_unreachable`, `warn_unused_ignores`. Re-enable as
# files are sweep-fixed.

[[tool.mypy.overrides]]
module = [
    "sentence_transformers.*",
    "pgvector.*",
    "boto3.*",
    "botocore.*",
    "docx.*",
    "openpyxl.*",
    "pptx.*",
    "langchain_groq.*",
    "langchain_anthropic.*",
    "langchain_openai.*",
    "langchain_community.*",
    "langgraph.*",
]
ignore_missing_imports = true

# Adapter modules where library type stubs disagree with the runtime API
# (langchain providers rename Pydantic-aliased fields; python-pptx exports a
# factory function shadowing the class name). Tests + lint cover correctness;
# mypy here would require unsightly per-line ignores against moving stubs.
[[tool.mypy.overrides]]
module = [
    "changetools.infrastructure.rendering.pptx_renderer",
    "changetools.infrastructure.llm.groq_provider",
    "changetools.infrastructure.llm.anthropic_provider",
    "changetools.infrastructure.llm.openai_provider",
    "changetools.infrastructure.embeddings.openai",
]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
    "integration: requires a running database",
    "eval: evaluation harness cases",
]
